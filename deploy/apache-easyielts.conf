# easyIELTS vhost for an EXISTING Apache already serving other sites on 80/443.
#
# Use this when ports 80/443 are taken (don't run the standalone Caddy script).
# It terminates TLS for your domain and reverse-proxies to the Node app on
# 127.0.0.1:3000, forwarding WebSocket upgrades (needed for live Speaking).
#
# Install (Debian/Ubuntu):
#   1) sudo a2enmod proxy proxy_http proxy_wstunnel rewrite ssl headers
#   2) Edit the ServerName lines and cert paths below for your domain.
#   3) sudo cp deploy/apache-easyielts.conf /etc/apache2/sites-available/easyielts.conf
#   4) sudo a2ensite easyielts
#   5) Get a cert:  sudo certbot --apache -d mywx.liyangai.com
#   6) sudo apache2ctl configtest && sudo systemctl reload apache2
#   7) Run the app:  bash start.sh   (keep it on 3000; HOST=127.0.0.1 is fine here)

<VirtualHost *:80>
    ServerName mywx.liyangai.com
    Redirect permanent / https://mywx.liyangai.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName mywx.liyangai.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/mywx.liyangai.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mywx.liyangai.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # WebSocket upgrade (live speaking proxy) — requires mod_proxy_wstunnel.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:3000/$1" [P,L]

    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
