# easyIELTS vhost for an EXISTING Nginx already serving other sites on 80/443.
#
# Use this when ports 80/443 are taken (don't run the standalone Caddy script).
# It terminates TLS for your domain and reverse-proxies to the Node app on
# 127.0.0.1:3000, forwarding WebSocket upgrades (needed for live Speaking).
#
# Install (Debian/Ubuntu):
#   1) Edit the two `server_name` lines and the cert paths below for your domain.
#   2) sudo cp deploy/nginx-easyielts.conf /etc/nginx/conf.d/easyielts.conf
#   3) Get a cert (adds the cert paths automatically):
#        sudo certbot --nginx -d mywx.liyangai.com
#      (or point ssl_certificate(_key) at an existing cert)
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) Run the app:  bash start.sh   (keep it on 3000; HOST=127.0.0.1 is fine here)

# Maps the Upgrade header for WebSocket support. Files in conf.d/ are included in
# the http{} context, so this `map` is valid here. If you instead place the server
# blocks under sites-available/, move this `map` into your http{} block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mywx.liyangai.com;          # <-- your domain
    # Let certbot answer ACME challenges, then redirect everything to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mywx.liyangai.com;          # <-- your domain

    # Filled in by `certbot --nginx`, or set to your existing cert paths:
    ssl_certificate     /etc/letsencrypt/live/mywx.liyangai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mywx.liyangai.com/privkey.pem;

    # Audio uploads (speaking eval) can be a few MB.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (live speaking proxy)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
